tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Returns a single contact by its ID for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 64f2d5f3c789ab1234567890
    description: The unique ID of the contact
responses:
  '200':
    description: Successfully found contact
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 64f2d5f3c789ab1234567890!
            data:
              $ref: ../../../components/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
