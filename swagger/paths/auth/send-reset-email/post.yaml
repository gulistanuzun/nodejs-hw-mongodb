tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Sends a password reset link to the user's email address. The link contains a JWT token valid for 5 minutes.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: gulistan@example.com
responses:
  '200':
    description: Reset email successfully sent
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    description: User not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User not found!
  '500':
    description: Failed to send email
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: Failed to send the email, please try again later.
